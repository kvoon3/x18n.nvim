pre-commit:
  jobs:
    - name: stylua
      glob: "**/*.lua"
      run: stylua {staged_files}
      stage_fixed: true
    - name: selene
      glob: "**/*.lua"
      run: selene --display-style quiet {staged_files}
    - name: comments
      glob: "**/*.lua"
      run: nvim -l scripts/lint_comments.lua {staged_files}
    - name: ls-lint
      run: ls-lint {staged_files}
